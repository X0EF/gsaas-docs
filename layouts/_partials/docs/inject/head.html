<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  .theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 10; cursor: pointer;
    background: var(--body-background); color: var(--body-font-color);
    border: 1px solid var(--gray-200); border-radius: 50%; width: 2.25rem; height: 2.25rem;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="auto"] .theme-toggle .icon-moon { display: none; }
  }
</style>
